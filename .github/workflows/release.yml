name: Release

# Builds the packages. Pushing a tag like v0.1.0 publishes a GitHub release.
# Running it by hand ("Run workflow") uploads the packages as artifacts, and
# with a version in "release" it also creates that tag and publishes the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Tag to create and publish, e.g. v0.1.1 (empty: only build)"
        required: false
        default: ""

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release }}

permissions:
  contents: read

jobs:
  linux:
    # The oldest supported runner, so the .deb works on Ubuntu 22.04 / Debian 12 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Version
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/app/Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - name: Check tag matches version
        if: env.TAG != ''
        run: test "$TAG" = "v$VERSION"
      - run: cargo build --release -p youtube-downloader
      - run: packaging/fetch-tools.sh linux-x64 packaging/build/linux-x64
      - name: .deb
        run: |
          cargo deb -p youtube-downloader --no-build --output "youtube-downloader_${VERSION}_amd64.deb"
      - name: AppImage
        run: |
          packaging/linux/build-appimage.sh target/release/youtube-downloader \
            packaging/build/linux-x64 "YouTube_Downloader-${VERSION}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            *.deb
            *.AppImage

  macos:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            platform: macos-arm64
            arch: arm64
          - target: x86_64-apple-darwin
            platform: macos-x64
            arch: x86_64
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Version
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/app/Cargo.toml | head -1)" >> "$GITHUB_ENV"
      - run: cargo build --release -p youtube-downloader --target ${{ matrix.target }}
      - run: packaging/fetch-tools.sh ${{ matrix.platform }} packaging/build/${{ matrix.platform }}
      - name: .app and .dmg
        run: |
          packaging/macos/build-app.sh target/${{ matrix.target }}/release/youtube-downloader \
            packaging/build/${{ matrix.platform }} "$VERSION" \
            "YouTube_Downloader-${VERSION}-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: "*.dmg"

  release:
    # `env` is not available in job conditions, so spell out both cases.
    if: github.ref_type == 'tag' || inputs.release != ''
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on this commit when it does not exist yet.
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Downloads

            | System | File |
            |---|---|
            | Ubuntu, Debian, Mint, Pop!_OS (22.04 / 12 or newer) | `youtube-downloader_*_amd64.deb` |
            | Any Linux (x86_64) | `YouTube_Downloader-*-x86_64.AppImage` |
            | Mac with Apple Silicon (M1 and newer) | `YouTube_Downloader-*-macos-arm64.dmg` |
            | Mac with Intel | `YouTube_Downloader-*-macos-x86_64.dmg` |

            Install steps are in the [README](https://github.com/genetzhs/Youtube-downloader#install).
            Packages include yt-dlp and FFmpeg; see THIRD-PARTY-NOTICES.md inside each package.
